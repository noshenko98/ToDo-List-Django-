{% extends "base.html" %}

{% block content %}
  <div class="container">
    <h1 class="d-flex justify-content-between align-items-center">Tag List
      <a href="{% url "task_manager:tag-create" %}" class="btn btn-primary">Create</a>
    </h1>
  </div>
  <table class="table">
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    {% for tag in tags %}
    	<tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="#">Update</a>
        </td>
        <td>
          <a href="#">Delete</a>
        </td>
      </tr>
    {% endfor %}

  </table>
{% endblock %}
