{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="container">
      <h1>{{ object|yesno:"Update,Create" }} Tag</h1>
      <form action="" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" class="btn btn-dark bg-gradient" value="{{ object|yesno:"Update,Create" }}">
      </form>
    </div>
{% endblock %}
